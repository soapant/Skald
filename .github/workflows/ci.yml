name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            gcc-mingw-w64-x86-64 \
            libcurl4-openssl-dev \
            libx11-dev libxft-dev libfontconfig-dev libfreetype-dev \
            libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxi-dev \
            libglib2.0-dev libgpg-error-dev libp11-kit-dev libmount-dev

      - name: Bootstrap nob
        run: cc -O2 nob.c -o nob

      - name: Main Build
        run: ./nob --dynamic

      - name: Check skapi layering
        run: ./nob --check

      - name: Check generated artifacts are fresh
        run: ./nob --check-generated

      - name: Run tests
        run: ./nob --test --dynamic

      - name: Cross-compile for Windows
        run: ./nob --win32

      - name: Cross-compile Windows tests
        run: ./nob --win32 --test --dynamic

      - name: Release bundle smoke
        run: |
          ./nob --release --dynamic
          test -x release/skald
          test -f release/config/config.toml
          test -f release/build/sdk/core/skapi.h
          test -f release/build/features/control_center.so
          test -f release/build/features/settings.so
          test -f release/build/features/clipboard_history.so
          test -f release/features/control_center/manifest.toml
          test -f release/features/settings/manifest.toml
          test -f release/features/clipboard_history/manifest.toml
          test -f release/resources/Skald.ico

  linux-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config \
            libcurl4-openssl-dev \
            libx11-dev libxft-dev libfontconfig-dev libfreetype-dev \
            libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxi-dev \
            libglib2.0-dev libgpg-error-dev libp11-kit-dev libmount-dev

      - name: Bootstrap nob
        run: cc -O2 nob.c -o nob

      - name: Build and test with ASan + UBSan
        run: LSAN_OPTIONS=suppressions=tests/lsan.supp ./nob --asan --test --dynamic

      - name: Link app and features with ASan + UBSan
        run: ./nob --asan --dynamic

  linux-wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libcurl4-openssl-dev \
            libx11-dev libxft-dev libfontconfig-dev libfreetype-dev \
            libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxi-dev \
            libglib2.0-dev libwayland-dev libgpg-error-dev libp11-kit-dev \
            libmount-dev

      - name: Bootstrap nob
        run: cc -O2 nob.c -o nob

      - name: Build with Wayland backend
        run: ./nob --wayland --dynamic

      - name: Run tests with Wayland backend
        run: ./nob --wayland --test --dynamic
