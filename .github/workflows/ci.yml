name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            gcc-mingw-w64-x86-64 \
            libcurl4-openssl-dev \
            libx11-dev libxft-dev libfontconfig-dev libfreetype-dev \
            libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxi-dev \
            libglib2.0-dev libgpg-error-dev libp11-kit-dev libmount-dev

      - name: Bootstrap nob
        run: cc -O2 nob.c -o nob

      - name: Main Build
        run: ./nob -werror

      - name: Check skapi layering
        run: ./nob -check

      - name: Run tests
        run: ./nob -test

      - name: Cross-compile for Windows
        run: ./nob -win32

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 23.1.5
        run: |
          curl -L -o /tmp/llvm.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-Linux-X64.tar.xz
          mkdir -p /tmp/llvm
          tar -xJf /tmp/llvm.tar.xz -C /tmp/llvm
          echo "/tmp/llvm/LLVM-23.1.5-Linux-X64/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run --Werror

  linux-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config \
            libcurl4-openssl-dev \
            libx11-dev libxft-dev libfontconfig-dev libfreetype-dev \
            libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxi-dev \
            libglib2.0-dev libgpg-error-dev libp11-kit-dev libmount-dev

      - name: Bootstrap nob
        run: cc -O2 nob.c -o nob

      - name: Build and test with ASan + UBSan
        run: ./nob -asan -test
